<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sms Forwarder</title>
    <style>
        body {
            background-color: #0f172a; /* Dark Cyber Theme */
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 30px 20px;
            border-radius: 15px;
            border: 1px solid rgba(0, 255, 204, 0.2);
            text-align: center;
            width: 85%;
            max-width: 350px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
        }
        h2 { 
            color: #ffffff; 
            margin-top: 0;
            margin-bottom: 5px; 
            font-size: 22px;
        }
        p {
            color: #94a3b8;
            font-size: 14px;
            margin-bottom: 25px;
        }
        .status {
            display: inline-block;
            padding: 8px 15px;
            background: rgba(34, 197, 94, 0.2);
            color: #4ade80;
            border: 1px solid #22c55e;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
        }
        .log-box {
            margin-top: 25px;
            padding: 10px;
            background: rgba(0,0,0,0.3);
            border-radius: 8px;
            font-size: 12px;
            color: #cbd5e1;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <div class="glass-panel">
        <h2>ZYNEX FORWARDER</h2>
        <p>Auto Deposit System</p>
        
        <div class="status">🟢 Service is Active</div>
        
        <div class="log-box" id="logText">
            Waiting for new SMS...
        </div>
    </div>

    <script>
        // Ei function ta Java theke call kora hobe notun SMS asle
        function updateLog(message) {
            document.getElementById('logText').innerText = "Last SMS:\n" + message;
        }
    </script>
</body>
</html>
